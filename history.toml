# Public repositories whose CI uploads JUnit XML as GitHub Actions artifacts.
# `flakydetect discover-history` checks every candidate; `import-history` imports `repos`.
# Run by .github/workflows/history.yml on push to this file, or manually.

[history]
candidates = [
    "home-assistant/core",
    "apache/kafka",
    "apache/pulsar",
    "apache/arrow",
    "apache/druid",
    "apache/shardingsphere",
    "EnricoMi/publish-unit-test-result-action",
    "testcontainers/testcontainers-java",
    "getsentry/sentry",
    "python/mypy",
    "grafana/k6",
    "spring-projects/spring-framework",
]
# Chosen from the discovery run on 2026-10-28 (10/10 sampled default-branch runs had JUnit):
#   home-assistant/core  ~1.7 MB/run  (pytest, 10 shards)
#   apache/druid         ~57.6 MB/run (Maven Surefire)
repos = ["home-assistant/core", "apache/druid"]
max_runs = 30           # workflow runs per repo (newest first, default branch)
sample_pages = 3        # pages of 100 artifacts scanned per candidate during discovery
artifact_pattern = "(?i)(junit|test-?results?|test-?reports?|surefire)"
max_artifact_mb = 200
max_results_per_repo = 100000   # strict per-repo cap; a run that would pass it is skipped
max_db_mb = 300                 # stop importing past this (Supabase free tier is 500 MB)

[history.repo_patterns]
# Only the main suite; the MariaDB/Postgres variants would spend the row budget on
# duplicate environments instead of more runs.
"home-assistant/core" = "^test-results-full-"
"apache/druid" = "^unit-test-reports-"

[history.repo_sample]
# One run of each suite is bigger than max_results_per_repo on its own (2026-10-28:
# druid 310,314 results/run, home-assistant 105,256), so keep a stable 1-in-N sample of
# tests. ~2.6k results/run each, ~80k for 30 runs.
"home-assistant/core" = 40
"apache/druid" = 120
