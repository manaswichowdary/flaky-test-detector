name: Flaky Test Detector
description: Store JUnit results, score flaky tests, comment on PRs and open quarantine issues.
branding:
  icon: alert-triangle
  color: orange

inputs:
  command:
    description: "ingest | notify | all. Use ingest in matrix jobs and notify once afterwards."
    default: all
  junit-path:
    description: JUnit XML file(s) or directory (space separated). Needed for ingest.
    default: ""
  database-url:
    description: Persistent Postgres URL. Pass secrets.FLAKY_DATABASE_URL.
    required: true
  github-token:
    description: Token for comments and issues.
    default: ${{ github.token }}
  mode:
    description: "warn | issue | auto (overrides flakydetect.toml)"
    default: ""
  run-key:
    description: Unique id for this test run. Defaults to run_id-job; add the matrix index in matrix jobs.
    default: ""
  source:
    description: Label stored on the run (ci, demo, ...).
    default: ci
  python-version:
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install flakydetect
      shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - name: Ingest test results
      if: inputs.command == 'ingest' || inputs.command == 'all'
      shell: bash
      env:
        FLAKY_DATABASE_URL: ${{ inputs.database-url }}
        FLAKY_MODE: ${{ inputs.mode }}
        RUN_KEY: ${{ inputs.run-key || format('{0}-{1}', github.run_id, github.job) }}
        JUNIT_PATH: ${{ inputs.junit-path }}
        SOURCE: ${{ inputs.source }}
      run: |
        if [ -z "$JUNIT_PATH" ]; then echo "::error::junit-path is required for ingest"; exit 2; fi
        # shellcheck disable=SC2086
        flakydetect --require-persistent-db ingest $JUNIT_PATH --run-id "$RUN_KEY" --source "$SOURCE"
    - name: Score and notify
      if: inputs.command == 'notify' || inputs.command == 'all'
      shell: bash
      env:
        FLAKY_DATABASE_URL: ${{ inputs.database-url }}
        FLAKY_MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        flakydetect --require-persistent-db score
        flakydetect --require-persistent-db notify
