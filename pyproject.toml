[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakydetect"
version = "0.1.0"
description = "Detect flaky tests from JUnit results, warn on PRs, open quarantine issues"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "jinja2>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "responses>=0.25", "playwright>=1.40"]

[project.scripts]
flakydetect = "flakydetect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--ignore=demo"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
